name: Python bindings

on:
   workflow_dispatch:
   push:
      branches: [RC_2_0]
   pull_request:

concurrency:
   group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}
   cancel-in-progress: true

env:
   HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
   HOMEBREW_NO_AUTO_UPDATE: 1

jobs:

  test:
    name: build
    strategy:
      matrix:
        architecture: [x86_64]
    runs-on: macos-13

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1
        filter: tree:0

    - name: dependencies (MacOS)
      if: runner.os == 'macOS'
      run: |
        brew install boost-build boost boost-python3 python@3.11 openssl@3 python-setuptools
        export PATH=$(brew --prefix)/opt/python@3.11/bin:$PATH

    - name: build (MacOS)
      if: runner.os == 'macOS'
      run: |
        # Install to Homebrew's python site-packages. no need for --user and --prefix
        cd bindings/python
        export PATH=$(brew --prefix)/opt/python@3.11/bin:$PATH
        python3.11 setup.py bdist_wheel

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: python-bindings
        path: dist/